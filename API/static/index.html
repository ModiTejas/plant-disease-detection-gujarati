<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>પાકના પાનનું નિદાન — Dual-Mode AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Vaani:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #193229;
      --muted: #60746a;
      --green: #287a50;
      --green-dark: #1d5d3c;
      --mint: #e8f3e8;
      --cream: #fbfaf3;
      --line: #d8e5d8;
      --white: #ffffff;
      --warning: #9a5c19;
      --accent: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color: var(--ink);
      background-color: var(--cream);
      background-image: repeating-linear-gradient(125deg, transparent 0 48px, rgba(40, 122, 80, .025) 49px 50px), linear-gradient(135deg, #f1f7e8 0%, var(--cream) 54%, #e2f0e8 100%);
      font-family: "Mukta Vaani", sans-serif;
      min-height: 100vh;
    }
    main { display: flex; flex-direction: column; justify-content: center; width: min(1120px, calc(100% - 32px)); min-height: 100vh; margin: 0 auto; padding: 20px 0 60px; }
    main.has-result { justify-content: flex-start; padding-top: 14px; }
    main.has-result .eyebrow, main.has-result .intro { display: none; }
    main.has-result h1 { margin: 0 0 10px; font-size: 26px; }
    .eyebrow { color: var(--green); font: 700 13px/1.2 "Mukta Vaani", sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; max-width: 700px; margin: 6px 0 6px; font-weight: 800; }
    .intro { color: var(--muted); font: 16px/1.5 "Mukta Vaani", sans-serif; max-width: 650px; margin: 0 0 16px; }
    
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; width: min(720px, 100%); align-self: center; }
    .layout.has-result { width: 100%; grid-template-columns: minmax(280px, .82fr) minmax(0, 1.18fr); }
    
    .panel { background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 14px 40px rgba(39, 83, 55, .08); }
    .result-panel { display: none; min-width: 0; }
    .layout.has-result .result-panel { display: block; }
    
    .dropzone { display: grid; place-items: center; min-height: 190px; border: 2px dashed #a8c9af; border-radius: 8px; background: var(--mint); text-align: center; padding: 18px; cursor: pointer; transition: 0.2s ease; }
    .dropzone:hover, .dropzone.dragging { border-color: var(--green); background: #dceede; }
    .leaf-icon { font-size: 38px; margin-bottom: 4px; }
    .dropzone strong { display: block; font-size: 19px; margin-bottom: 4px; }
    .dropzone span { color: var(--muted); font: 14px/1.5 "Mukta Vaani", sans-serif; }
    input[type=file] { display: none; }
    .preview { display: none; width: 100%; max-height: 250px; object-fit: contain; border-radius: 6px; }
    .file-name { display: block; margin-top: 8px; color: var(--muted); font: 13px "Mukta Vaani", sans-serif; }
    
    button, .capture-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      border: 0;
      border-radius: 8px;
      margin-top: 12px;
      padding: 12px 16px;
      color: white;
      background: var(--green);
      font: 700 16px "Mukta Vaani", sans-serif;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      user-select: none;
    }
    button:hover, .capture-button:hover { background: var(--green-dark); }
    button.btn-vision { background: var(--accent); }
    button.btn-vision:hover { background: #b45309; }
    button:disabled { cursor: wait; opacity: .6; }
    
    .actions { display: flex; gap: 10px; align-items: stretch; margin-top: 12px; }
    .actions button { margin-top: 0; }
    .actions #analyze { flex: 1; }
    .capture-button { width: auto; flex: 0 0 auto; white-space: nowrap; margin-top: 0; background: #2f855a; }
    
    .result { display: none; padding: 4px; }
    .result.visible { display: block; }
    .result-heading { margin: 0 0 10px; color: var(--green-dark); font: 800 20px/1.3 "Mukta Vaani", sans-serif; }
    .prediction { margin: 2px 0; font-size: 14px; font-weight: 600; color: #6b7280; }
    .gujarati-title { font-family: "Mukta Vaani", sans-serif; font-size: 24px; font-weight: 800; color: var(--ink); margin: 2px 0 6px; }
    
    .result-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .result-category { display: inline-block; padding: 4px 10px; border-radius: 6px; background: #e5efe3; color: var(--green-dark); font: 700 13px "Mukta Vaani", sans-serif; }
    .confidence { display: inline-block; padding: 4px 10px; border-radius: 6px; background: #dcfce7; color: #166534; font: 700 13px "Mukta Vaani", sans-serif; }
    .uncertain { margin: 10px 0; padding: 10px 12px; border-left: 3px solid var(--warning); background: #fff3e6; color: #754510; font: 700 13px/1.45 "Mukta Vaani", sans-serif; border-radius: 4px; }
    
    .result-section { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
    .result-section h3 { margin: 0 0 4px; color: var(--green-dark); font: 800 15px/1.4 "Mukta Vaani", sans-serif; }
    .result-section p, .result-section ul { margin: 0; color: #27382e; font: 14px/1.55 "Mukta Vaani", sans-serif; }
    .result-section ul { padding-left: 18px; }
    .result-section li + li { margin-top: 3px; }
    
    .bar-row { display: grid; grid-template-columns: 1fr 50px; gap: 8px; margin-top: 6px; font: 12px "Mukta Vaani", sans-serif; }
    .bar-track { grid-column: 1 / -1; height: 6px; overflow: hidden; border-radius: 8px; background: #dce6dc; }
    .bar { height: 100%; border-radius: inherit; background: var(--green); transition: width .5s ease; }
    
    /* Mode Switch styles */
    .mode-switch { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 100; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.95); padding: 8px 14px; border-radius: 30px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 1px solid var(--line); }
    .mode-switch-label { font-size: 13px; font-weight: 700; color: var(--green-dark); }
    .switch-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .switch { position: relative; display: block; width: 46px; height: 26px; padding: 2px; border: 1px solid rgba(25,50,41,.13); border-radius: 999px; background: rgba(25,50,41,.14); box-shadow: inset 0 1px 2px rgba(25,50,41,.12); cursor: pointer; transition: background-color .3s ease; }
    .switch::before { content: ""; display: block; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.96); box-shadow: 0 1px 3px rgba(25,50,41,.22); transform: translateX(0); transition: transform .3s ease; }
    .switch-input:checked + .switch { border-color: rgba(217, 119, 6, 0.24); background: var(--accent); }
    .switch-input:checked + .switch::before { transform: translateX(20px); }
    
    .mode-note { display: none; margin: 8px 0 10px; padding: 8px 12px; border-radius: 6px; background: #fef3c7; border-left: 3px solid var(--accent); color: #78350f; font: 700 13px/1.4 "Mukta Vaani", sans-serif; }
    .mode-note.visible { display: block; }
    .loading { display: none; margin-top: 12px; color: var(--green-dark); font: 700 14px "Mukta Vaani", sans-serif; text-align: center; }
    .loading.visible { display: block; }
    .error { display: none; margin-top: 14px; color: var(--warning); font: 14px/1.4 "Mukta Vaani", sans-serif; background: #fff3e6; padding: 10px; border-radius: 6px; border-left: 3px solid var(--warning); }
    footer { margin-top: 20px; color: var(--muted); font: 12px/1.5 "Mukta Vaani", sans-serif; text-align: center; }

    @media (max-width: 700px) {
      main { width: min(560px, calc(100% - 24px)); padding: 12px 0 42px; }
      .layout, .layout.has-result { width: 100%; grid-template-columns: minmax(0, 1fr); }
      .result-panel { grid-row: 2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">પાક આરોગ્ય તપાસ (Plant Health AI)</div>
    <h1>પાકના પાનનું નિદાન</h1>
    <p class="intro">પાનની તસવીરથી પાકની સ્થિતિ જાણો અને ગુજરાતી માર્ગદર્શન મેળવો.</p>

    <section class="layout">
      <div class="panel upload-panel">
        <!-- File input for gallery/upload -->
        <label class="dropzone" id="dropzone" for="image-input">
          <div id="upload-message">
            <div class="leaf-icon">🌿</div>
            <strong>પાનની તસવીર પસંદ કરો</strong>
            <span>અહીં ક્લિક કરો અથવા ફોટો અપલોડ કરો</span>
          </div>
          <img class="preview" id="preview" alt="પાકના પાનની તસવીર">
          <input id="image-input" type="file" accept="image/*">
        </label>
        
        <!-- Native Camera Input & Trigger Label -->
        <input id="camera-input" type="file" accept="image/*" capture="environment">
        
        <span class="file-name" id="file-name">કોઈ તસવીર પસંદ કરી નથી</span>
        <p class="mode-note" id="mode-note" role="status"></p>
        
        <div class="actions">
          <label class="capture-button" for="camera-input">📷 ફોટો લો</label>
          <button id="analyze" type="button" disabled>તપાસ કરો</button>
        </div>
        
        <div class="loading" id="loading" role="status">તપાસ ચાલી રહી છે... કૃપા કરીને રાહ જુઓ.</div>
        <div class="error" id="error" role="alert"></div>
      </div>

      <div class="panel result-panel">
        <div class="result" id="result">
          <h2 class="result-heading" id="result-heading">🌿 પાકની તપાસનું પરિણામ</h2>
          <div class="prediction" id="prediction"></div>
          <div class="gujarati-title" id="gujarati-title"></div>
          
          <div class="result-meta">
            <div class="result-category" id="category"></div>
            <div class="confidence" id="confidence"></div>
          </div>
          
          <div class="uncertain" id="uncertainty" hidden></div>
          <div id="result-sections"></div>
          <div id="probabilities"></div>
        </div>
      </div>
    </section>

    <!-- Bottom Mode Toggle Switch -->
    <div class="mode-switch">
      <span class="mode-switch-label" id="mode-switch-label">🔬 મોડેલ વિશ્લેષણ</span>
      <input class="switch-input" id="mode-toggle" type="checkbox" role="switch" aria-label="AI Vision mode">
      <label class="switch" for="mode-toggle" aria-hidden="true"></label>
    </div>

    <footer>ચોક્કસ માર્ગદર્શન માટે સ્થાનિક કૃષિ નિષ્ણાતની સલાહ લો.</footer>
  </main>

  <script>
    const input = document.getElementById('image-input');
    const cameraInput = document.getElementById('camera-input');
    const dropzone = document.getElementById('dropzone');
    const preview = document.getElementById('preview');
    const uploadMessage = document.getElementById('upload-message');
    const fileName = document.getElementById('file-name');
    const analyze = document.getElementById('analyze');
    const errorBox = document.getElementById('error');
    const result = document.getElementById('result');
    const layout = document.querySelector('.layout');
    const main = document.querySelector('main');
    const modeToggle = document.getElementById('mode-toggle');
    const modeSwitchLabel = document.getElementById('mode-switch-label');
    const modeNote = document.getElementById('mode-note');
    const loading = document.getElementById('loading');
    const resultSections = document.getElementById('result-sections');
    const resultHeading = document.getElementById('result-heading');
    
    let currentMode = 'project'; // 'project' or 'vision'
    let selectedFile = null;
    let isAnalyzing = false;

    function chooseFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showError('કૃપા કરીને માન્ય છોડના પાનની તસવીર (JPG/PNG) પસંદ કરો.');
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name || 'કેમેરા ફોટો';
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      uploadMessage.style.display = 'none';
      analyze.disabled = false;
      result.classList.remove('visible');
      layout.classList.remove('has-result');
      main.classList.remove('has-result');
      errorBox.style.display = 'none';
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function setMode(mode) {
      currentMode = mode;
      const isProjectMode = mode === 'project';
      modeToggle.checked = !isProjectMode;
      
      if (isProjectMode) {
        modeSwitchLabel.textContent = "🔬 મોડેલ વિશ્લેષણ";
        modeSwitchLabel.style.color = "var(--green-dark)";
        modeNote.classList.remove('visible');
        analyze.classList.remove('btn-vision');
      } else {
        modeSwitchLabel.textContent = "🤖 AI વિઝન મોડ";
        modeSwitchLabel.style.color = "var(--accent)";
        modeNote.classList.add('visible');
        modeNote.textContent = "🤖 AI વિઝન મોડ સક્રિય: કેરી, લીંબુ, પપૈયા અથવા અન્ય કોઈપણ છોડના સામાન્ય વિશ્લેષણ માટે.";
        analyze.classList.add('btn-vision');
      }
      
      analyze.disabled = !selectedFile || isAnalyzing;
      errorBox.style.display = 'none';
    }

    function addResultSection(title, content, asList = false) {
      if (!content) return;
      let items = Array.isArray(content) ? content.filter(t => typeof t === 'string' && t.trim()) : [content.toString().trim()];
      if (!items.length || !items[0]) return;
      
      const section = document.createElement('section');
      section.className = 'result-section';
      const heading = document.createElement('h3');
      heading.textContent = title;
      section.appendChild(heading);
      
      if (asList || items.length > 1) {
        const list = document.createElement('ul');
        items.forEach(item => {
          const entry = document.createElement('li');
          entry.textContent = item;
          list.appendChild(entry);
        });
        section.appendChild(list);
      } else {
        const paragraph = document.createElement('p');
        paragraph.textContent = items[0];
        section.appendChild(paragraph);
      }
      resultSections.appendChild(section);
    }

    function displayPrediction(data) {
      resultSections.replaceChildren();
      document.getElementById('probabilities').replaceChildren();

      if (data.mode === 'vision') {
        resultHeading.textContent = "🤖 AI વિઝન વિશ્લેષણ પરિણામ";
        const diag = data.diagnosis || {};

        if (diag.is_plant === false) {
          showError("તસવીરમાં કોઈ પાન અથવા છોડ મળી આવ્યો નથી. કૃપા કરીને પાનની સ્પષ્ટ તસવીર અપલોડ કરો.");
          return;
        }

        const plantName = diag.plant_gu || diag.plant_en || '';
        const title = diag.name_gu || diag.name_en || 'સામાન્ય સમસ્યા';
        
        document.getElementById('prediction').textContent = `${diag.plant_en || ''} — ${diag.name_en || ''}`;
        document.getElementById('gujarati-title').textContent = `${title} (${plantName})`;
        
        const categoryElement = document.getElementById('category');
        categoryElement.textContent = `પ્રકાર: ${diag.type_gu || 'વિશ્લેષણ'}`;
        categoryElement.hidden = false;
        
        const confidenceElement = document.getElementById('confidence');
        confidenceElement.textContent = `વિશ્વાસ સ્તર: ${diag.confidence_assessment || 'મધ્યમ'}`;
        confidenceElement.hidden = false;
        
        const uncertainty = document.getElementById('uncertainty');
        uncertainty.textContent = diag.ai_note_gu ? `ℹ️ AI નોંધ: ${diag.ai_note_gu}` : '';
        uncertainty.hidden = !diag.ai_note_gu;
        
        if (diag.cause_gu) addResultSection('🔍 સમસ્યાનું સંભવિત કારણ:', diag.cause_gu);
        addResultSection('🍂 દેખાતા લક્ષણો:', diag.symptoms_gu, true);
        addResultSection('💊 સૂચિત ઉપાય અને સારવાર:', diag.management_gu, true);
        addResultSection('🛡️ ભવિષ્યમાં બચાવના પગલાં:', diag.prevention_gu, true);

      } else {
        // Project Model Mode
        resultHeading.textContent = "🔬 પ્રશિક્ષિત મોડેલ પરિણામ";
        const d = data.details || {};
        const plantName = d.plant_gu || '';
        const diseaseName = d.name_gu || data.prediction || data.predicted_class || '';

        document.getElementById('prediction').textContent = (data.prediction || data.predicted_class || '').replace('___', ' — ').replaceAll('_', ' ');
        document.getElementById('gujarati-title').textContent = `${diseaseName} ${plantName ? `(${plantName})` : ''}`;

        const categoryElement = document.getElementById('category');
        categoryElement.textContent = `પ્રકાર: ${d.type_gu || 'રોગ / સમસ્યા'}`;
        categoryElement.hidden = false;

        const confidenceElement = document.getElementById('confidence');
        confidenceElement.textContent = `ઓળખ વિશ્વાસ: ${Number(data.confidence).toFixed(1)}%`;
        confidenceElement.hidden = false;

        const uncertainty = document.getElementById('uncertainty');
        const isUncertain = data.is_uncertain === true || data.is_confident === false;
        uncertainty.textContent = isUncertain ? (data.uncertainty_note || '⚠️ ઓળખ અંગે ખાતરી ઓછી છે. વધુ સ્પષ્ટ તસવીર અપલોડ કરીને ફરી તપાસો અથવા AI વિઝન મોડ વાપરો.') : '';
        uncertainty.hidden = !isUncertain;

        addResultSection('🍂 દેખાતા લક્ષણો:', d.symptoms_gu, true);
        if (d.cause_gu) addResultSection('🔬 રોગકારક જંતુ / ફૂગનું કારણ:', d.cause_gu);
        addResultSection('💊 સૂચિત ઉપાય અને સારવાર:', d.management_gu, true);
        addResultSection('🛡️ ભવિષ્ય માટે બચાવ પગલાં:', d.prevention_gu, true);

        // Render Top 3 Bars
        const predictions = data.top_3 || data.top_predictions || [];
        if (predictions.length > 0) {
          const probabilityBox = document.getElementById('probabilities');
          const topHeading = document.createElement('h3');
          topHeading.className = 'result-section';
          topHeading.textContent = 'અન્ય સંભવિત ઓળખ (Top Probabilities)';
          probabilityBox.appendChild(topHeading);
          
          predictions.forEach(item => {
            const row = document.createElement('div');
            row.className = 'bar-row';
            const label = document.createElement('span');
            label.textContent = item.name_gu || item.class.replace('___', ' — ');
            const percentage = document.createElement('span');
            percentage.textContent = `${Number(item.confidence).toFixed(1)}%`;
            const track = document.createElement('div');
            track.className = 'bar-track';
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.width = `${item.confidence}%`;
            track.appendChild(bar);
            row.append(label, percentage, track);
            probabilityBox.appendChild(row);
          });
        }
      }

      result.classList.add('visible');
      layout.classList.add('has-result');
      main.classList.add('has-result');
    }

    function handleFileEvent(e) {
      if (e.target.files && e.target.files[0]) {
        chooseFile(e.target.files[0]);
      }
      e.target.value = ''; // Reset to allow re-taking photos
    }

    input.addEventListener('change', handleFileEvent);
    cameraInput.addEventListener('change', handleFileEvent);
    modeToggle.addEventListener('change', () => setMode(modeToggle.checked ? 'vision' : 'project'));
    
    ['dragenter', 'dragover'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.remove('dragging'); }));
    dropzone.addEventListener('drop', ev => { ev.preventDefault(); dropzone.classList.remove('dragging'); if (ev.dataTransfer.files[0]) chooseFile(ev.dataTransfer.files[0]); });

    analyze.addEventListener('click', async () => {
      if (!selectedFile || isAnalyzing) return;
      isAnalyzing = true;
      const formData = new FormData();
      formData.append('file', selectedFile);
      analyze.disabled = true;
      loading.classList.add('visible');
      errorBox.style.display = 'none';
      result.classList.remove('visible');

      const endpoint = currentMode === 'project' ? '/predict' : '/analyze-vision';

      try {
        const response = await fetch(endpoint, { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'વિશ્લેષણ કરવામાં ખામી સર્જાઈ.');
        displayPrediction(data);
      } catch (error) {
        console.error('Analysis error:', error);
        showError(error.message || 'સર્વર સાથે જોડાણ થઈ શક્યું નથી.');
      } finally {
        isAnalyzing = false;
        loading.classList.remove('visible');
        analyze.disabled = !selectedFile;
      }
    });

    setMode('project');
  </script>
</body>
</html>
